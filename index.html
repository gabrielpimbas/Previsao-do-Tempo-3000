<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Título e link que liga o HTML com o css -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta do Clima</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Cabeçalho da página -->
    <header>
      <h1>Previsão do Tempo 3000</h1>
      <p>Descubra o clima na sua cidade!</p>
    </header>
    <!-- Conteúdo principal -->
    <main>
      <h2>Consulte o Clima</h2>
      <form>
        <label for="city">Digite o nome da cidade:</label>
        <input type="text" id="city" name="city" required />
        <button type="submit">Consultar</button>
      </form>
    </main>
    <!-- Rodapé da página -->
    <footer>
      <p>&copy; 2026 Previsão do Tempo 3000. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
