<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Título e link que liga o HTML com o css -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta do Clima</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>
  <body>
    <!-- Cabeçalho da página -->
    <header>
      <h1>Previsão do Tempo 3000</h1>
      <p>Descubra o clima na sua cidade!</p>
    </header>
    <!-- Conteúdo principal -->
    <main>
      <h2>Consulte o Clima</h2>
      <form>
        <label for="cidade">Digite o nome da cidade:</label>
        <input type="text" id="cidade" name="cidade" required />
        <button type="button" id="buscar">Consultar</button>
      </form>
      <section id="resultado">
        <!-- O JavaScript colocará o resultado aqui -->
      </section>
    </main>
    <!-- Rodapé da página -->
    <footer>
      <p>&copy; 2026 Previsão do Tempo 3000. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
